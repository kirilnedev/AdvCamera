name: Release

# Push a tag like v1.2.0 to build and publish a GitHub release:
#   git tag v1.2.0
#   git push origin v1.2.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/AdvCamera/AdvCamera.csproj -c Release -r win-x64 --self-contained `
            -p:Version=$version -o publish/AdvCamera
          Compress-Archive -Path publish/AdvCamera -DestinationPath AdvCamera-win-x64.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" AdvCamera-win-x64.zip --title "AdvCamera ${{ github.ref_name }}" --generate-notes
