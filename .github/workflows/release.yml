name: Release

# Push a tag like v1.2.0 to build and publish a GitHub release:
#   git tag v1.2.0
#   git push origin v1.2.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/AdvCamera/AdvCamera.csproj -c Release -r win-x64 --self-contained `
            -p:Version=$version -o publish/AdvCamera
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/AdvCamera -DestinationPath artifacts/AdvCamera-$version-win-x64.zip

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./installer/build-installer.ps1 -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts/*.exe, artifacts/*.zip).FullName `
            --title "AdvCamera ${{ github.ref_name }}" --generate-notes
